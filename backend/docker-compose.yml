version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # Assuming the API runs on port 8080
    environment:
      - PORT=5000
      - MONGODB_URL=${MONGODB_URL}
      - GOOGLE_CLIENT_ID=158681474175-cf26s15teatsmg8mmt3s0a6fq2l35csj.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ACCESS_SECRET_KEY=${ACCESS_SECRET_KEY}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY}
    volumes:
      - .:/usr/src/app  # For development, mount the code for hot reloading
    networks:
      - impro-network


networks:
  impro-network:
    driver: bridge
